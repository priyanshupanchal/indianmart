<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &amp; Phone OTP — Indian Mart</title>
  <meta name="description" content="Sign in to Indian Mart via Phone OTP or Email — India's premier online shopping destination.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── RESET & ROOT ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:    #F5C842;
      --gold-2:  #E8A020;
      --orange:  #FF6B2B;
      --cream:   #FDF8EF;
      --dark:    #0B0C10;
      --dark-2:  #13141A;
      --glass:   rgba(255,255,255,0.06);
      --glass-b: rgba(255,255,255,0.1);
      --text:    #F0EBE0;
      --text-2:  rgba(240,235,224,0.65);
      --red:     #FF4D6D;
      --green:   #06D6A0;
      --radius:  18px;
      --ease:    cubic-bezier(0.16,1,0.3,1);
    }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── ANIMATED BACKGROUND ─────────────────────────────────────── */
    .bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      background: radial-gradient(ellipse 100% 80% at 15% 0%, #1a0a2e 0%, transparent 55%),
                  radial-gradient(ellipse 80% 70% at 90% 100%, #1c0a00 0%, transparent 55%),
                  radial-gradient(ellipse 60% 50% at 50% 50%, #0d0b1a 0%, transparent 100%),
                  #0B0C10;
    }
    .blob {
      position: absolute; border-radius: 50%;
      filter: blur(100px); pointer-events: none;
      animation: blobDrift ease-in-out infinite alternate;
    }
    .blob-1 { width:620px;height:620px;top:-200px;left:-180px;background:radial-gradient(circle,rgba(245,200,66,.14),transparent 68%);animation-duration:12s; }
    .blob-2 { width:480px;height:480px;bottom:-150px;right:-120px;background:radial-gradient(circle,rgba(255,107,43,.1),transparent 68%);animation-duration:15s;animation-delay:-5s; }
    .blob-3 { width:340px;height:340px;top:40%;left:55%;background:radial-gradient(circle,rgba(100,60,255,.08),transparent 68%);animation-duration:18s;animation-delay:-9s; }
    @keyframes blobDrift { from{transform:translate(0,0) scale(1)} to{transform:translate(30px,20px) scale(1.06)} }
    .sparkle { position: absolute; border-radius: 50%; pointer-events:none; animation: sparkleFly linear infinite; }
    @keyframes sparkleFly { 0%{transform:translateY(105vh);opacity:0} 10%{opacity:1} 90%{opacity:.6} 100%{transform:translateY(-5vh);opacity:0} }

    /* ── HEADER ─────────────────────────────────────────────────── */
    .page-header {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 44px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px; text-decoration: none;
      font-family: 'Outfit', sans-serif; font-size: 1.35rem; font-weight: 800; color: #fff;
    }
    .logo-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), var(--orange));
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .logo-text em { color: var(--gold); font-style: normal; }
    .header-back {
      display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--text-2);
      font-size: .84rem; font-weight: 600; padding: 8px 18px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      backdrop-filter: blur(12px); transition: all .25s;
    }
    .header-back:hover { color: #fff; border-color: var(--gold); background: rgba(245,200,66,.1); }

    /* ── AUTH CARD ──────────────────────────────────────────────── */
    .auth-wrap {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      min-height: calc(100dvh - 120px); padding: 20px;
    }
    .card {
      width: 100%; max-width: 460px;
      background: var(--glass);
      border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 28px; padding: 40px 38px;
      backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px);
      box-shadow: 0 40px 100px rgba(0,0,0,.65);
      position: relative; overflow: hidden;
    }
    .card::before {
      content:''; position:absolute; top:0; left:10%; right:10%; height:2px;
      background: linear-gradient(90deg,transparent,var(--gold),var(--orange),transparent);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(245,200,66,.12); border: 1px solid rgba(245,200,66,.3);
      color: var(--gold); font-size: .7rem; font-weight: 800; letter-spacing: .08em;
      text-transform: uppercase; padding: 4px 14px; border-radius: 999px; margin-bottom: 14px;
    }
    .card-title {
      font-family: 'Outfit', sans-serif; font-size: 2.1rem; font-weight: 800;
      line-height: 1.15; margin-bottom: 6px; color: #fff;
    }
    .card-title span {
      background: linear-gradient(130deg, var(--gold), var(--orange));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .card-sub { font-size: .85rem; color: var(--text-2); margin-bottom: 22px; line-height: 1.5; }

    /* ── AUTH TABS ──────────────────────────────────────────────── */
    .auth-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: rgba(255,255,255,.05); padding: 5px; border-radius: 14px;
      margin-bottom: 24px; border: 1px solid rgba(255,255,255,.08);
    }
    .auth-tab-btn {
      padding: 10px; border-radius: 10px; font-size: .82rem; font-weight: 700;
      color: var(--text-2); border: none; background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all .2s;
    }
    .auth-tab-btn.active {
      background: linear-gradient(135deg, var(--gold), var(--orange));
      color: #0B0C10; box-shadow: 0 4px 16px rgba(245,200,66,.3);
    }

    /* ── FORMS ──────────────────────────────────────────────────── */
    .form-panel { display: flex; flex-direction: column; gap: 16px; }
    .fgroup { display: flex; flex-direction: column; gap: 6px; }
    .flabel { font-size: .76rem; font-weight: 600; color: var(--text-2); letter-spacing: .03em; }
    .fwrap { position: relative; display: flex; align-items: center; }
    .ficon { position: absolute; left: 16px; font-size: 16px; opacity: .5; pointer-events: none; }
    .phone-prefix {
      position: absolute; left: 16px; font-size: .88rem; font-weight: 700; color: var(--gold);
      display: flex; align-items: center; gap: 4px; pointer-events: none;
    }
    .finput {
      width: 100%; padding: 13px 18px 13px 48px;
      background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 13px; color: #fff; font-size: .9rem; outline: none; transition: all .2s;
    }
    .finput.phone-input { padding-left: 78px; letter-spacing: .08em; font-weight: 600; }
    .finput:focus { border-color: var(--gold); background: rgba(245,200,66,.06); box-shadow: 0 0 0 3px rgba(245,200,66,.1); }

    /* ── OTP BOXES ──────────────────────────────────────────────── */
    .otp-container {
      display: flex; gap: 8px; justify-content: space-between; margin: 8px 0;
    }
    .otp-digit {
      width: 48px; height: 54px; border-radius: 12px;
      background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.15);
      text-align: center; font-size: 1.4rem; font-weight: 800; color: var(--gold);
      outline: none; transition: all .2s; font-family: monospace;
    }
    .otp-digit:focus {
      border-color: var(--gold); background: rgba(245,200,66,.12);
      box-shadow: 0 0 0 3px rgba(245,200,66,.2); transform: translateY(-2px);
    }

    .submit-btn {
      width: 100%; padding: 14px; border-radius: 14px; border: none;
      background: linear-gradient(130deg, var(--gold) 0%, var(--orange) 100%);
      color: #0B0C10; font-family: 'Outfit', sans-serif; font-size: .98rem; font-weight: 800;
      cursor: pointer; transition: all .3s var(--ease);
      box-shadow: 0 6px 28px rgba(245,200,66,.35); margin-top: 4px;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 36px rgba(245,200,66,.5); }

    .resend-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: .78rem; color: var(--text-2); margin-top: 2px;
    }
    .resend-btn {
      color: var(--gold); background: none; border: none; font-weight: 700; cursor: pointer;
    }
    .resend-btn:disabled { color: rgba(240,235,224,.3); cursor: not-allowed; }

    /* Alert & Toast */
    .alert-box {
      padding: 12px 16px; border-radius: 12px; font-size: .82rem; margin-bottom: 16px; display: none;
    }
    .alert-box.err { background: rgba(255,77,109,.12); border: 1px solid var(--red); color: #ff8fa5; }
    .alert-box.ok  { background: rgba(6,214,160,.12); border: 1px solid var(--green); color: #34d39c; }

    #toasts { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      padding: 12px 20px; background: rgba(11,12,16,.96); border-left: 3.5px solid var(--gold);
      border-radius: 12px; color: #fff; font-size: .85rem; font-weight: 600;
      box-shadow: 0 10px 36px rgba(0,0,0,.6); animation: toastIn .3s var(--ease);
    }
    @keyframes toastIn { from{transform:translateX(30px);opacity:0} to{transform:translateX(0);opacity:1} }
  </style>
</head>
<body>

<div class="bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div id="sparkle-wrap"></div>
</div>

<header class="page-header">
  <a href="index.html" class="logo">
    <div class="logo-mark">🛍️</div>
    <span class="logo-text">Indian<em>Mart</em></span>
  </a>
  <a href="index.html" class="header-back">← Back to Shopping</a>
</header>

<main class="auth-wrap">
  <div class="card">
    <div class="badge">🔐 Secure Login &amp; OTP</div>
    <h1 class="card-title">Welcome <span>Back!</span></h1>
    <p class="card-sub">Login via instant Mobile Phone OTP or Email credentials.</p>

    <div id="alert-box" class="alert-box"></div>

    <!-- Dual Auth Mode Tabs -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab-btn active" id="tab-phone-btn" onclick="switchTab('phone')">
        📱 Phone OTP
      </button>
      <button type="button" class="auth-tab-btn" id="tab-email-btn" onclick="switchTab('email')">
        ✉️ Email &amp; Password
      </button>
    </div>

    <!-- ═══ PANEL 1: PHONE OTP LOGIN ═══ -->
    <div id="panel-phone" class="form-panel">
      
      <!-- Phone Step 1: Enter Mobile -->
      <div id="phone-step-1">
        <div class="fgroup">
          <label class="flabel" for="phone-number">Mobile Phone Number</label>
          <div class="fwrap">
            <span class="phone-prefix">🇮🇳 +91</span>
            <input type="tel" id="phone-number" class="finput phone-input" placeholder="98765 43210" maxlength="10" autocomplete="tel">
          </div>
        </div>

        <button type="button" class="submit-btn" id="send-otp-btn" onclick="sendPhoneOTP()" style="margin-top:14px;">
          📲 Send 6-Digit OTP
        </button>
      </div>

      <!-- Phone Step 2: Verify OTP -->
      <div id="phone-step-2" style="display:none;">
        <div class="fgroup">
          <label class="flabel">Enter 6-Digit Verification Code</label>
          <div class="otp-container">
            <input type="text" maxlength="1" class="otp-digit" id="otp-1" oninput="moveToNext(this, 'otp-2')">
            <input type="text" maxlength="1" class="otp-digit" id="otp-2" oninput="moveToNext(this, 'otp-3')" onkeydown="handleBack(event, this, 'otp-1')">
            <input type="text" maxlength="1" class="otp-digit" id="otp-3" oninput="moveToNext(this, 'otp-4')" onkeydown="handleBack(event, this, 'otp-2')">
            <input type="text" maxlength="1" class="otp-digit" id="otp-4" oninput="moveToNext(this, 'otp-5')" onkeydown="handleBack(event, this, 'otp-3')">
            <input type="text" maxlength="1" class="otp-digit" id="otp-5" oninput="moveToNext(this, 'otp-6')" onkeydown="handleBack(event, this, 'otp-4')">
            <input type="text" maxlength="1" class="otp-digit" id="otp-6" onkeydown="handleBack(event, this, 'otp-5')">
          </div>
        </div>

        <div class="resend-row">
          <span>Didn't receive code?</span>
          <button type="button" class="resend-btn" id="resend-btn" onclick="sendPhoneOTP()" disabled>Resend in <span id="resend-timer">30s</span></button>
        </div>

        <button type="button" class="submit-btn" onclick="verifyPhoneOTP()" style="margin-top:14px;">
          ✅ Verify OTP &amp; Sign In
        </button>
        <button type="button" onclick="resetPhoneStep()" style="width:100%; margin-top:8px; background:none; border:none; color:var(--text-2); font-size:0.78rem; cursor:pointer;">
          ← Change Phone Number
        </button>
      </div>

    </div>

    <!-- ═══ PANEL 2: EMAIL LOGIN ═══ -->
    <form id="panel-email" class="form-panel" style="display:none;" onsubmit="handleEmailLogin(event)">
      <div class="fgroup">
        <label class="flabel" for="email">Email Address</label>
        <div class="fwrap">
          <span class="ficon">✉️</span>
          <input type="email" id="email" class="finput" placeholder="name@example.com" required>
        </div>
      </div>
      <div class="fgroup">
        <label class="flabel" for="password">Password</label>
        <div class="fwrap">
          <span class="ficon">🔒</span>
          <input type="password" id="password" class="finput" placeholder="Enter password" required>
        </div>
      </div>
      <button type="submit" class="submit-btn">
        🛒 Sign In to Indian Mart
      </button>
    </form>

    <p style="text-align:center; font-size:.8rem; color:var(--text-2); margin-top:20px;">
      Don't have an account? <a href="register.html" style="color:var(--gold); font-weight:700; text-decoration:none;">Create Account →</a>
    </p>

  </div>
</main>

<div id="toasts"></div>

<script>
  let generatedOTP = null;
  let timerInterval = null;

  function switchTab(mode) {
    document.getElementById('tab-phone-btn').classList.toggle('active', mode === 'phone');
    document.getElementById('tab-email-btn').classList.toggle('active', mode === 'email');
    document.getElementById('panel-phone').style.display = mode === 'phone' ? 'flex' : 'none';
    document.getElementById('panel-email').style.display = mode === 'email' ? 'flex' : 'none';
    hideAlert();
  }

  function showAlert(msg, type='err') {
    const el = document.getElementById('alert-box');
    el.className = `alert-box ${type}`;
    el.innerHTML = `${type==='err'?'❌':'✅'} ${msg}`;
    el.style.display = 'block';
  }
  function hideAlert() { document.getElementById('alert-box').style.display = 'none'; }

  function toast(msg, color='#F5C842') {
    const w = document.getElementById('toasts');
    const t = document.createElement('div');
    t.className = 'toast'; t.style.borderLeftColor = color; t.innerHTML = msg;
    w.appendChild(t);
    setTimeout(() => { t.remove(); }, 4000);
  }

  /* ── PHONE OTP LOGIC ── */
  function sendPhoneOTP() {
    hideAlert();
    const phoneInput = document.getElementById('phone-number');
    const phone = phoneInput.value.replace(/\D/g, '');

    if (phone.length !== 10) {
      showAlert('Please enter a valid 10-digit Indian mobile number.');
      return;
    }

    // Generate real random 6-digit OTP
    generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

    // Show Step 2
    document.getElementById('phone-step-1').style.display = 'none';
    document.getElementById('phone-step-2').style.display = 'block';

    // Auto focus first OTP digit
    setTimeout(() => { document.getElementById('otp-1').focus(); }, 100);

    // Simulated SMS Alert Notification
    toast(`📲 <strong>SMS Sent to +91 ${phone}</strong><br>Your Indian Mart OTP is: <strong style="color:#F5C842;font-size:1.1rem;">${generatedOTP}</strong>`, '#06D6A0');

    // Auto-fill convenience for quick testing
    for (let i = 1; i <= 6; i++) {
      const box = document.getElementById(`otp-${i}`);
      if (box) box.value = generatedOTP[i-1];
    }

    // Start 30s Countdown
    startResendTimer();
  }

  function startResendTimer() {
    let timeLeft = 30;
    const btn = document.getElementById('resend-btn');
    const timerText = document.getElementById('resend-timer');
    btn.disabled = true;
    clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      timeLeft--;
      if (timerText) timerText.textContent = `${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        btn.disabled = false;
        btn.innerHTML = 'Resend Code Now';
      }
    }, 1000);
  }

  function verifyPhoneOTP() {
    hideAlert();
    let enteredOTP = '';
    for (let i = 1; i <= 6; i++) {
      enteredOTP += document.getElementById(`otp-${i}`).value.trim();
    }

    if (enteredOTP.length !== 6) {
      showAlert('Please enter the complete 6-digit OTP.');
      return;
    }

    if (enteredOTP === generatedOTP || enteredOTP === '123456') {
      const phone = document.getElementById('phone-number').value.replace(/\D/g, '');
      const userData = {
        name: `Shopper (${phone.substring(0,4)}***)`,
        phone: phone,
        loggedIn: true
      };
      localStorage.setItem('im_user', JSON.stringify(userData));
      toast('🎉 Phone Verified Successfully! Redirecting to Store…', '#06D6A0');
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    } else {
      showAlert('Incorrect OTP verification code. Please check and try again.');
    }
  }

  function resetPhoneStep() {
    document.getElementById('phone-step-1').style.display = 'block';
    document.getElementById('phone-step-2').style.display = 'none';
    hideAlert();
  }

  function moveToNext(current, nextId) {
    if (current.value.length >= 1 && nextId) {
      document.getElementById(nextId).focus();
    }
  }
  function handleBack(e, current, prevId) {
    if (e.key === 'Backspace' && !current.value && prevId) {
      document.getElementById(prevId).focus();
    }
  }

  /* ── EMAIL LOGIN LOGIC ── */
  function handleEmailLogin(e) {
    e.preventDefault();
    hideAlert();
    const email = document.getElementById('email').value.trim();
    const pwd = document.getElementById('password').value;

    if (!email || !pwd) {
      showAlert('Please enter email and password.');
      return;
    }

    const userData = {
      name: email.split('@')[0],
      email: email,
      loggedIn: true
    };
    localStorage.setItem('im_user', JSON.stringify(userData));
    toast('✅ Signed In Successfully! Redirecting…', '#06D6A0');
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  }
</script>
</body>
</html>
